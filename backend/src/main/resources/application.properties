spring.application.name=backend
server.port=${PORT:8081}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smart_job_portal}
spring.data.mongodb.auto-index-creation=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

tavily.api-id=${TAVILY_API_ID:}
tavily.api.key=${TAVILY_API_KEY:}
tavily.api.url=${TAVILY_API_URL:https://api.tavily.com/search}

adzuna.app-id=${ADZUNA_APP_ID:}
adzuna.app-key=${ADZUNA_APP_KEY:}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/responses}
openai.api.key=${OPENAI_API_KEY:}